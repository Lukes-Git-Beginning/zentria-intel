services:
  intel-bot:
    build:
      context: .
      dockerfile: .bot/Dockerfile
    env_file: .env
    # Match Hetzner deploy-UID (id deploy → 1000:1000) so git commits in /app
    # don't end up root-owned and block subsequent `git pull` from the deploy user.
    user: "1000:1000"
    volumes:
      - .:/app:rw
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, time; f='/app/.state/bot_heartbeat.txt'; assert os.path.exists(f) and time.time()-os.path.getmtime(f)<600"
      interval: 60s
      timeout: 5s
      retries: 3
