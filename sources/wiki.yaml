      - url: https://www.notion.so/blog/rss.xml
        type: rss
        trust: 8

  - name: Confluence
    feeds:
      - url: https://www.atlassian.com/blog/feed/all
        type: rss
        trust: 7

  - name: Slab
    feeds:
      - url: https://slab.com/blog/feed/
        type: rss
        trust: 5

  - name: Outline
    feeds:
      - url: https://github.com/outline/outline/releases.atom
        type: atom
        trust: 7

  - name: BookStack
    feeds:
      - url: https://github.com/BookStackApp/BookStack/releases.atom
        type: atom
        trust: 6

  - name: Logseq
    feeds:
      - url: https://github.com/logseq/logseq/releases.atom
        type: atom
        trust: 6

